[build-system]
requires = ["setuptools>=77"]  # for the SPDX license field
build-backend = "setuptools.build_meta"

[project]
name = "octlabels"
version = "0.1.0"
authors = [
  { name = "Botond Fazekas", email = "ABotond@users.noreply.github.com" },
]
description = "File formats and a library for OCT labels: retinal layers, regions and lesions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.22",
  "pillow>=9.1",
  "pyyaml>=6.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["OCT", "retina", "layer segmentation", "biomarker", "annotation"]

[project.urls]
Homepage = "https://github.com/BogunovicLabMUW/octlabels"
Documentation = "https://bogunoviclabmuw.github.io/octlabels/"
Repository = "https://github.com/BogunovicLabMUW/octlabels"
Issues = "https://github.com/BogunovicLabMUW/octlabels/issues"

[project.optional-dependencies]
matlab = ["scipy>=1.7", "h5py>=3.0"]
dev = ["pytest", "ruff", "black"]
# MkDocs 2 drops the plugin system that mkdocstrings needs.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "black"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional style

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
